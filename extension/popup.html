<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>ارسال درخواست‌های فلووین</title></head><body>
<h1>ارسال درخواست‌ها</h1><p>فهرست کپی‌شده از داشبورد را وارد کنید.</p><textarea id="batch" aria-label="فهرست فرصت‌ها" rows="4" placeholder="فهرست کپی‌شده"></textarea>
<div class="controls"><button id="review">بررسی فهرست</button><button id="sessions">بررسی حساب‌ها</button></div><p id="status" role="status"></p><div id="session-results"></div><section id="review-area" hidden><h2>بازبینی درخواست‌ها</h2><p>نام حساب و رزومه برای هر فرصت را بررسی کنید. پنجره را تا پایان باز نگه دارید.</p><label>رزومه جابینجا <select id="resume"><option value="profile">رزومه جابینجایی</option><option value="uploaded">رزومه پیوست</option></select></label><ol id="items"></ol><button id="start" disabled>ارسال درخواست‌های آماده</button><button id="stop" hidden>توقف پس از درخواست جاری</button></section>
<script src="popup.js"></script></body></html>
